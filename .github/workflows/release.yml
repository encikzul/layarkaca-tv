name: Release

# Push a tag like v1.0 and this builds the launcher, signs it with the project's own key (the
# RELEASE_* secrets, made once with tools/make-release-key.sh), and publishes the APK on the Releases page
# with its SHA-256 and signing certificate, so anyone can check the file they install.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64" || { echo "Missing secret RELEASE_KEYSTORE_B64: see README-MY.md, Penerbit."; exit 1; }
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests and signed release build
        working-directory: launcher
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Checksum and certificate
        run: |
          out="layarkaca-${GITHUB_REF_NAME}.apk"
          cp launcher/app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$out" > signing-cert.txt
          cat "$out.sha256" signing-cert.txt
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="layarkaca-${GITHUB_REF_NAME}.apk"
          {
            echo "APK LayarKaca ${GITHUB_REF_NAME}, dibina oleh GitHub Actions daripada kod pada tag ini."
            echo
            echo "SHA-256:"
            echo '```'
            cat "$out.sha256"
            echo '```'
            echo "Sijil tandatangan:"
            echo '```'
            cat signing-cert.txt
            echo '```'
            echo "Cara pasang: README-MY.md."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$out" "$out.sha256" signing-cert.txt \
            --title "LayarKaca ${GITHUB_REF_NAME}" --notes-file notes.md
